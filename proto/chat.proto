syntax = "proto3";

option csharp_namespace = "Chat";

message Solicitacao {
  string acao = 1;
  string usuario = 2;
  string canal = 3;
  int64 timestamp = 4;
  string texto = 5;
  int64 contador = 6;
}

message Resposta {
  bool sucesso = 1;
  string mensagem = 2;
  repeated string canais = 3;
  int64 timestamp = 4;
  int64 contador = 5;
  repeated Publicacao historico = 6;
}

message Publicacao {
  string canal = 1;
  string usuario = 2;
  string texto = 3;
  int64 timestamp = 4;
  int64 contador = 5;
  string id = 6;
  int64 timestamp_solicitacao = 7;
  int64 contador_solicitacao = 8;
}

message PedidoReferencia {
  string acao = 1;
  string nome = 2;
  int64 timestamp = 3;
  int64 contador = 4;
}

message ServidorInfo {
  string nome = 1;
  int32 rank = 2;
}

message RespostaReferencia {
  bool sucesso = 1;
  int32 rank = 2;
  repeated ServidorInfo servidores = 3;
  int64 timestamp = 4;
  int64 contador = 5;
  string mensagem = 6;
}

message MensagemServidor {
  string acao = 1;
  string nome = 2;
  int32 rank = 3;
  int64 timestamp = 4;
  int64 contador = 5;
  bool sucesso = 6;
  int64 hora = 7;
  repeated Operacao operacoes = 8;
  int64 cursor = 9;
  string replica_id = 10;
}

message Operacao {
  string id = 1;
  string tipo = 2;
  string usuario = 3;
  string canal = 4;
  string texto = 5;
  int64 timestamp = 6;
  int64 timestamp_solicitacao = 7;
  int64 contador = 8;
}
